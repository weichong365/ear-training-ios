<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>
:root{--cream:#F6F0E3;--ivory:#FFFDF7;--ink:#1B211D;--muted:#5F6F65;--forest:#1D6B4D;--forest-deep:#103C2B;--forest-soft:#DCEDE3;--border:#D4DED7;--gold:#B78922;--nav-bg:#202438;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
.canvas{width:1290px;height:2796px;background:var(--cream);position:relative;overflow:hidden;}
.statusbar{height:180px;padding:0 70px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.statusbar .time{font-size:54px;font-weight:700;color:#fff;margin-left:30px;}
.statusbar .right{display:flex;align-items:center;gap:18px;}
.statusbar .right svg{display:block;}
.dynamic-island{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:360px;height:110px;background:#000;border-radius:55px;}
.nav-bg{background:var(--nav-bg);padding:30px 50px 50px;height:200px;display:flex;align-items:center;justify-content:space-between;}
.nav-title{color:#fff;font-size:60px;font-weight:800;letter-spacing:1px;}
.chip{display:flex;align-items:center;gap:14px;padding:18px 30px;border-radius:50px;background:rgba(255,255,255,.14);color:#fff;font-size:38px;font-weight:700;}
.chip svg{width:30px;height:30px;}
.hero{height:380px;margin:0 50px 40px;background:linear-gradient(135deg,#1D6B4D 0%,#103C2B 100%);border-radius:50px;padding:50px 60px;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-30px;top:30%;font-size:300px;color:rgba(255,255,255,.08);font-weight:900;transform:rotate(-15deg);font-family:serif;line-height:1;}
.hero-title{color:#fff;font-size:64px;font-weight:900;letter-spacing:-1px;}
.hero-sub{color:rgba(255,255,255,.85);font-size:32px;margin-top:14px;font-weight:700;}
.hero-data{position:absolute;right:60px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:30px;padding:24px 30px;display:flex;align-items:center;gap:30px;}
.metric{text-align:center;color:#fff;}
.metric-num{font-size:50px;font-weight:900;font-variant-numeric:tabular-nums;}
.metric-label{font-size:24px;opacity:.8;margin-top:6px;}
.divider{width:2px;height:60px;background:rgba(255,255,255,.3);}
.section{margin:0 50px 30px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.module-card{background:var(--ivory);border:1.5px solid var(--border);border-radius:32px;padding:30px 28px;min-height:300px;display:flex;align-items:center;box-shadow:0 6px 14px rgba(20,34,26,.06);}
.module-icon{width:140px;height:140px;border-radius:36px;background:var(--forest-soft);display:flex;align-items:center;justify-content:center;font-size:80px;flex-shrink:0;}
.module-icon.gold{background:#F5E4C9;}
.module-icon.coral{background:#F8E7A9;}
.module-icon.amber{background:#FCEAB0;}
.module-copy{flex:1;margin-left:28px;min-width:0;}
.module-name{color:var(--ink);font-size:46px;font-weight:900;line-height:1.2;}
.module-desc{margin-top:10px;color:var(--muted);font-size:30px;line-height:1.4;}
.section-hint{margin:0 50px 16px;color:var(--muted);font-size:30px;}
.cta{background:#E3F2E8;border:1.5px solid #B9DCCA;border-radius:32px;padding:36px 40px;display:flex;align-items:center;margin:0 50px 30px;min-height:200px;}
.cta-icon{width:140px;height:140px;border-radius:36px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:80px;flex-shrink:0;}
.cta-copy{flex:1;margin-left:30px;}
.cta-title{color:#167653;font-size:46px;font-weight:900;}
.cta-tag{display:inline-block;margin-left:18px;padding:6px 16px;border-radius:12px;background:#CFE8D8;color:#237A57;font-size:26px;font-weight:700;}
.cta-desc{margin-top:10px;color:#587567;font-size:30px;}
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 50px 30px;}
.quick-card{background:var(--ivory);border:1.5px solid var(--border);border-radius:28px;padding:28px 24px;display:flex;align-items:center;min-height:200px;box-shadow:0 6px 14px rgba(20,34,26,.06);}
.quick-icon{width:120px;height:120px;border-radius:30px;background:#F5E4C9;display:flex;align-items:center;justify-content:center;font-size:64px;flex-shrink:0;}
.footer-link{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:30px;color:var(--muted);font-size:32px;}
</style></head>
<body>
<div class="canvas">
  <div class="statusbar">
    <div class="time">9:41</div>
    <div class="dynamic-island"></div>
    <div class="right">
      <svg width="60" height="44" viewBox="0 0 60 44"><rect x="0" y="28" width="10" height="16" rx="2" fill="#fff"/><rect x="14" y="20" width="10" height="24" rx="2" fill="#fff"/><rect x="28" y="10" width="10" height="34" rx="2" fill="#fff"/><rect x="42" y="0" width="10" height="44" rx="2" fill="#fff"/></svg>
      <svg width="56" height="40" viewBox="0 0 56 40"><path d="M28 36 L34 30 A6 6 0 0 0 22 30 Z" fill="#fff"/><path d="M28 24 Q38 14 50 24 L46 28 Q38 20 28 28 Q18 20 10 28 L6 24 Q18 14 28 24 Z" fill="#fff"/><path d="M28 8 Q44 -8 56 8 L52 12 Q40 4 28 12 Q16 4 4 12 L0 8 Q12 -8 28 8 Z" fill="#fff"/></svg>
      <svg width="80" height="40" viewBox="0 0 80 40"><rect x="0" y="0" width="72" height="40" rx="8" fill="none" stroke="#fff" stroke-width="3"/><rect x="74" y="12" width="6" height="16" rx="2" fill="#fff"/><rect x="6" y="6" width="56" height="28" rx="4" fill="#fff"/></svg>
    </div>
  </div>

  <div class="nav-bg">
    <div class="nav-title">练耳搭子</div>
    <div class="chip">北京 <svg viewBox="0 0 30 30"><path d="M8 12 L15 19 L22 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

  <div class="hero">
    <div class="hero-title">练耳搭子</div>
    <div class="hero-sub">音乐艺考 · 视唱练耳专项训练</div>
    <div class="hero-data">
      <div class="metric"><div class="metric-num">32</div><div class="metric-label">累计练习</div></div>
      <div class="divider"></div>
      <div class="metric"><div class="metric-num">86%</div><div class="metric-label">正确率</div></div>
    </div>
  </div>

  <div class="section-hint">按北京市题型生成 · 通用模板</div>

  <div class="section">
    <div class="grid-2">
      <div class="module-card">
        <div class="module-icon">♪</div>
        <div class="module-copy"><div class="module-name">单音听辨</div><div class="module-desc">钢琴键盘作答</div></div>
      </div>
      <div class="module-card">
        <div class="module-icon gold">♫</div>
        <div class="module-copy"><div class="module-name">音组听辨</div><div class="module-desc">多音顺序识别</div></div>
      </div>
      <div class="module-card">
        <div class="module-icon coral">𝄞</div>
        <div class="module-copy"><div class="module-name">音程听辨</div><div class="module-desc">旋律与和声</div></div>
      </div>
      <div class="module-card">
        <div class="module-icon amber">♬</div>
        <div class="module-copy"><div class="module-name">节奏听辨</div><div class="module-desc">8 小节节奏型</div></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="grid-2">
      <div class="module-card">
        <div class="module-icon" style="background:#E4F0E8;">📋</div>
        <div class="module-copy"><div class="module-name">模拟考试</div><div class="module-desc">全国统考电子卷面</div></div>
      </div>
      <div class="module-card">
        <div class="module-icon" style="background:#FBF0CF;">🎯</div>
        <div class="module-copy"><div class="module-name">智能强化</div><div class="module-desc">个性推荐 · 错题弱项</div></div>
      </div>
    </div>
  </div>

  <div class="quick-row">
    <div class="quick-card">
      <div class="quick-icon" style="background:#F8E7E3;">📖</div>
      <div class="module-copy"><div class="module-name">错题复盘</div><div class="module-desc">强化薄弱点</div></div>
    </div>
    <div class="quick-card">
      <div class="quick-icon" style="background:#E2F1E8;">📊</div>
      <div class="module-copy"><div class="module-name">练习统计</div><div class="module-desc">查看成长趋势</div></div>
    </div>
  </div>

  <div class="footer-link">给学长提建议 · 关于与音色版权</div>
</div>
</body></html>
