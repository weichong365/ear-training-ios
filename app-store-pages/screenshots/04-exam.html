<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>
:root{--cream:#F6F0E3;--ivory:#FFFDF7;--ink:#1B211D;--muted:#5F6F65;--forest:#1D6B4D;--forest-deep:#103C2B;--forest-soft:#DCEDE3;--border:#D4DED7;--gold:#B78922;--warning-soft:#FBF0CF;--success:#237A57;--success-soft:#E2F1E8;--danger:#B84F4A;--danger-soft:#F8E7E3;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
.canvas{width:1290px;height:2796px;background:var(--cream);position:relative;overflow:hidden;}
.statusbar{height:180px;padding:0 70px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.statusbar .time{font-size:54px;font-weight:700;color:#fff;margin-left:30px;}
.statusbar .right{display:flex;align-items:center;gap:18px;}
.statusbar .right svg{display:block;}
.dynamic-island{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:360px;height:110px;background:#000;border-radius:55px;}
.nav-bg{background:var(--forest-deep);height:200px;padding:0 60px;display:flex;align-items:center;justify-content:space-between;}
.nav-back{width:80px;height:80px;display:flex;align-items:center;justify-content:center;}
.nav-back svg{width:48px;height:48px;}
.nav-title{font-size:50px;font-weight:800;color:#fff;letter-spacing:1px;}
.nav-time{font-size:48px;color:#fff;font-weight:900;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.3);padding:12px 28px;border-radius:20px;}
.exam-meta{margin:30px 60px 0;background:var(--ivory);border:1.5px solid var(--border);border-radius:30px;padding:32px 36px;display:flex;justify-content:space-between;align-items:center;}
.meta-item{text-align:center;}
.meta-num{font-size:60px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;}
.meta-label{font-size:28px;color:var(--muted);margin-top:6px;}
.meta-divider{width:2px;height:60px;background:var(--border);}
.qheader{margin:30px 60px 0;display:flex;justify-content:space-between;align-items:center;}
.qtype{font-size:44px;font-weight:900;color:var(--ink);}
.qprogress{font-size:34px;color:var(--muted);font-weight:700;}
.qprogress b{color:var(--forest);font-weight:900;}
.section-label{margin:36px 60px 14px;font-size:30px;color:var(--muted);font-weight:800;letter-spacing:2px;}
.play-card{margin:0 60px 30px;background:linear-gradient(135deg,var(--success-soft) 0%,#fff 100%);border:1.5px solid var(--success);border-radius:32px;padding:32px 40px;display:flex;align-items:center;}
.play-btn{width:140px;height:140px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.play-btn svg{width:60px;height:60px;fill:#fff;}
.play-copy{flex:1;margin-left:30px;}
.play-title{font-size:44px;font-weight:900;color:var(--ink);}
.play-sub{margin-top:10px;font-size:30px;color:var(--muted);}
.qa-card{margin:0 60px 30px;background:var(--ivory);border:1.5px solid var(--border);border-radius:32px;padding:32px 36px;}
.qa-title{font-size:34px;color:var(--muted);font-weight:700;margin-bottom:20px;}
.qa-staff{background:#fff;border-radius:18px;padding:24px;height:280px;}
.qa-staff svg{width:100%;height:100%;}
.qgrid-card{margin:0 60px 30px;background:var(--ivory);border:1.5px solid var(--border);border-radius:32px;padding:30px 32px;}
.qgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-top:20px;}
.qcell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--muted);background:var(--cream);border-radius:12px;}
.qcell.done{background:var(--success-soft);color:var(--success);}
.qcell.current{background:var(--forest);color:#fff;box-shadow:0 4px 12px rgba(29,107,77,.3);}
.qcell.skip{background:var(--warning-soft);color:#8A671E;}
.bottom-cta{margin:30px 60px 0;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.cta{padding:30px 0;text-align:center;font-size:42px;font-weight:900;border-radius:24px;letter-spacing:2px;}
.cta-primary{background:var(--forest);color:#fff;}
.cta-secondary{background:var(--ivory);color:var(--ink);border:1.5px solid var(--border);}
</style></head>
<body>
<div class="canvas">
  <div class="statusbar">
    <div class="time">9:41</div>
    <div class="dynamic-island"></div>
    <div class="right">
      <svg width="60" height="44" viewBox="0 0 60 44"><rect x="0" y="28" width="10" height="16" rx="2" fill="#fff"/><rect x="14" y="20" width="10" height="24" rx="2" fill="#fff"/><rect x="28" y="10" width="10" height="34" rx="2" fill="#fff"/><rect x="42" y="0" width="10" height="44" rx="2" fill="#fff"/></svg>
      <svg width="56" height="40" viewBox="0 0 56 40"><path d="M28 36 L34 30 A6 6 0 0 0 22 30 Z" fill="#fff"/><path d="M28 24 Q38 14 50 24 L46 28 Q38 20 28 28 Q18 20 10 28 L6 24 Q18 14 28 24 Z" fill="#fff"/><path d="M28 8 Q44 -8 56 8 L52 12 Q40 4 28 12 Q16 4 4 12 L0 8 Q12 -8 28 8 Z" fill="#fff"/></svg>
      <svg width="80" height="40" viewBox="0 0 80 40"><rect x="0" y="0" width="72" height="40" rx="8" fill="none" stroke="#fff" stroke-width="3"/><rect x="74" y="12" width="6" height="16" rx="2" fill="#fff"/><rect x="6" y="6" width="56" height="28" rx="4" fill="#fff"/></svg>
    </div>
  </div>

  <div class="nav-bg">
    <div class="nav-back"><svg viewBox="0 0 48 48"><path d="M30 10 L18 24 L30 38" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="nav-title">模拟考试 · 广东省</div>
    <div class="nav-time">18:42</div>
  </div>

  <div class="exam-meta">

  <div class="qheader">

  <div class="play-card">

  <div class="qa-card">

    <div class="qa-staff">
      <svg viewBox="0 0 1100 220" preserveAspectRatio="xMidYMid meet">
        <g stroke="#5F6F65" stroke-width="2.5">
          <line x1="0" y1="40" x2="1100" y2="40"/>
          <line x1="0" y1="80" x2="1100" y2="80"/>
          <line x1="0" y1="120" x2="1100" y2="120"/>
          <line x1="0" y1="160" x2="1100" y2="160"/>
          <line x1="0" y1="200" x2="1100" y2="200"/>
        </g>
        <text x="20" y="170" font-family="serif" font-size="180" fill="#1B211D">𝄞</text>
        <g fill="#1B211D">
          <ellipse cx="240" cy="120" rx="20" ry="14" transform="rotate(-20 240 120)"/>
          <line x1="258" y1="120" x2="258" y2="40" stroke="#1B211D" stroke-width="3"/>
          <ellipse cx="380" cy="80" rx="20" ry="14" transform="rotate(-20 380 80)"/>
          <line x1="398" y1="80" x2="398" y2="20" stroke="#1B211D" stroke-width="3"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="section-label">答题卡</div>
  <div class="qgrid-card">
    <div class="qgrid">
      <div class="qcell done">1</div>
      <div class="qcell done">2</div>
      <div class="qcell done">3</div>
      <div class="qcell done">4</div>
      <div class="qcell done">5</div>
      <div class="qcell current">6</div>
      <div class="qcell">7</div>
      <div class="qcell">8</div>
      <div class="qcell">9</div>
      <div class="qcell skip">10</div>
      <div class="qcell">11</div>
      <div class="qcell">12</div>
      <div class="qcell">13</div>
      <div class="qcell">14</div>
    </div>
  </div>

  <div class="bottom-cta">
    <div class="cta cta-secondary">暂停</div>
    <div class="cta cta-primary">交卷</div>
  </div>
</div>
</body></html>
