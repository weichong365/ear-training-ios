<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>
:root{--cream:#F6F0E3;--ivory:#FFFDF7;--ink:#1B211D;--muted:#5F6F65;--forest:#1D6B4D;--forest-deep:#103C2B;--forest-soft:#DCEDE3;--border:#D4DED7;--gold:#B78922;--warning-soft:#FBF0CF;--success:#237A57;--success-soft:#E2F1E8;--danger:#B84F4A;--danger-soft:#F8E7E3;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
.canvas{width:1290px;height:2796px;background:var(--cream);position:relative;overflow:hidden;}
.statusbar{height:180px;padding:0 70px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.statusbar .time{font-size:54px;font-weight:700;color:#fff;margin-left:30px;}
.statusbar .right{display:flex;align-items:center;gap:18px;}
.statusbar .right svg{display:block;}
.dynamic-island{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:360px;height:110px;background:#000;border-radius:55px;}
.nav-bg{background:var(--forest-deep);height:200px;padding:0 60px;display:flex;align-items:center;justify-content:space-between;}
.nav-back{width:80px;height:80px;display:flex;align-items:center;justify-content:center;}
.nav-back svg{width:48px;height:48px;}
.nav-title{font-size:50px;font-weight:800;color:#fff;letter-spacing:1px;}
.head-card{margin:30px 60px 0;background:linear-gradient(135deg,var(--forest) 0%,var(--forest-deep) 100%);border-radius:36px;padding:50px 50px;color:#fff;}
.head-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;text-align:center;}
.head-num{font-size:80px;font-weight:900;font-variant-numeric:tabular-nums;}
.head-label{font-size:28px;opacity:.85;margin-top:10px;}
.head-divider{width:2px;background:rgba(255,255,255,.25);}
.head-row{align-items:center;}
.section{margin:40px 60px 0;}
.section-title{font-size:36px;font-weight:800;color:var(--ink);margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;}
.section-title .more{font-size:28px;color:var(--forest);font-weight:700;}
.module-card{background:var(--ivory);border:1.5px solid var(--border);border-radius:28px;padding:28px 32px;margin-bottom:18px;}
.module-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.module-name{font-size:38px;font-weight:800;color:var(--ink);}
.module-meta{font-size:30px;color:var(--muted);font-weight:700;}
.module-meta b{color:var(--ink);font-weight:900;}
.bar{height:18px;background:var(--cream);border-radius:9px;overflow:hidden;}
.bar-fill{height:100%;background:var(--forest);border-radius:9px;}
.bar-fill.warn{background:var(--gold);}
.bar-fill.danger{background:var(--danger);}
.tip{margin:30px 60px 0;background:var(--warning-soft);border:1.5px solid var(--gold);border-radius:28px;padding:32px 36px;display:flex;align-items:center;}
.tip-icon{width:110px;height:110px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:64px;flex-shrink:0;}
.tip-copy{flex:1;margin-left:30px;}
.tip-title{font-size:38px;font-weight:900;color:#8A671E;}
.tip-desc{margin-top:10px;font-size:28px;color:#8A671E;line-height:1.5;}
</style></head>
<body>
<div class="canvas">
  <div class="statusbar">
    <div class="time">9:41</div>
    <div class="dynamic-island"></div>
    <div class="right">
      <svg width="60" height="44" viewBox="0 0 60 44"><rect x="0" y="28" width="10" height="16" rx="2" fill="#fff"/><rect x="14" y="20" width="10" height="24" rx="2" fill="#fff"/><rect x="28" y="10" width="10" height="34" rx="2" fill="#fff"/><rect x="42" y="0" width="10" height="44" rx="2" fill="#fff"/></svg>
      <svg width="56" height="40" viewBox="0 0 56 40"><path d="M28 36 L34 30 A6 6 0 0 0 22 30 Z" fill="#fff"/><path d="M28 24 Q38 14 50 24 L46 28 Q38 20 28 28 Q18 20 10 28 L6 24 Q18 14 28 24 Z" fill="#fff"/><path d="M28 8 Q44 -8 56 8 L52 12 Q40 4 28 12 Q16 4 4 12 L0 8 Q12 -8 28 8 Z" fill="#fff"/></svg>
      <svg width="80" height="40" viewBox="0 0 80 40"><rect x="0" y="0" width="72" height="40" rx="8" fill="none" stroke="#fff" stroke-width="3"/><rect x="74" y="12" width="6" height="16" rx="2" fill="#fff"/><rect x="6" y="6" width="56" height="28" rx="4" fill="#fff"/></svg>
    </div>
  </div>

  <div class="nav-bg">
    <div class="nav-back"><svg viewBox="0 0 48 48"><path d="M30 10 L18 24 L30 38" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="nav-title">练习统计</div>
    <div style="width:80px;"></div>
  </div>

  <div class="head-card">
    <div class="head-row">
      <div><div class="head-num">328</div><div class="head-label">累计题数</div></div>
      <div class="head-divider"></div>
      <div><div class="head-num">86%</div><div class="head-label">总正确率</div></div>
      <div class="head-divider"></div>
      <div><div class="head-num">12h</div><div class="head-label">练习时长</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">分模块表现<span class="more">详情 ›</span></div>

    <div class="module-card">
      <div class="module-row">
        <div class="module-name">单音听辨</div>
        <div class="module-meta"><b>96%</b> · 84 题</div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:96%;"></div></div>
    </div>

    <div class="module-card">
      <div class="module-row">
        <div class="module-name">音组听辨</div>
        <div class="module-meta"><b>89%</b> · 52 题</div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:89%;"></div></div>
    </div>

    <div class="module-card">
      <div class="module-row">
        <div class="module-name">音程听辨</div>
        <div class="module-meta"><b>78%</b> · 68 题</div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:78%;"></div></div>
    </div>

    <div class="module-card">
      <div class="module-row">
        <div class="module-name">和弦听辨</div>
        <div class="module-meta"><b>82%</b> · 44 题</div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:82%;"></div></div>
    </div>

    <div class="module-card">
      <div class="module-row">
        <div class="module-name">节奏听辨</div>
        <div class="module-meta"><b>91%</b> · 36 题</div>
      </div>
      <div class="bar"><div class="bar-fill" style="width:91%;"></div></div>
    </div>

    <div class="module-card">
      <div class="module-row">
        <div class="module-name">旋律听辨</div>
        <div class="module-meta"><b>73%</b> · 44 题</div>
      </div>
      <div class="bar"><div class="bar-fill warn" style="width:73%;"></div></div>
    </div>
  </div>

  <div class="tip">
    <div class="tip-icon">🎯</div>
    <div class="tip-copy">
      <div class="tip-title">智能强化建议</div>
      <div class="tip-desc">「旋律听辨」正确率偏低，下一节练习自动增加此模块的出题比例</div>
    </div>
  </div>
</div>
</body></html>
