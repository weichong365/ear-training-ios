<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>练耳搭子</title>
<style>
  :root { --ink:#1f2420; --muted:#5f6b62; --brand:#1f6f50; --brand-soft:#e6f2eb; --bg:#f7f4ec; --card:#ffffff; --line:#e7e2d6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); line-height:1.75; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 20px 60px; }
  header { background:var(--brand); color:#fff; border-radius:18px; padding:32px 24px; text-align:center; }
  header h1 { margin:0; font-size:26px; font-weight:900; letter-spacing:1px; }
  header .sub { margin-top:8px; font-size:14px; opacity:.88; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin:16px 0; display:flex; align-items:center; justify-content:space-between; text-decoration:none; color:var(--ink); }
  .card h2 { margin:0; font-size:17px; font-weight:800; }
  .card p { margin:4px 0 0; font-size:13px; color:var(--muted); }
  .arrow { color:var(--brand); font-size:20px; font-weight:800; }
  .footer { text-align:center; font-size:12px; color:var(--muted); margin-top:28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>练耳搭子</h1>
    <div class="sub">音乐艺考 · 视唱练耳专项训练</div>
  </header>

  <a class="card" href="privacy.html">
    <div><h2>隐私政策</h2><p>了解我们如何最小化处理你的数据</p></div>
    <span class="arrow">›</span>
  </a>

  <a class="card" href="support.html">
    <div><h2>技术支持</h2><p>常见问题解答与联系我们</p></div>
    <span class="arrow">›</span>
  </a>

  <div class="footer">© 2026 练耳搭子</div>
</div>
</body>
</html>
