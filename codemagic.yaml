# Codemagic 构建配置（免费计划，macOS M2 每月 500 分钟）
# 用途：在无 Mac / 无国际信用卡的情况下，用 Codemagic 免费 CI 构建 iOS 并上传 App Store Connect。
workflows:
  ios-build:
    name: 练耳搭子 iOS 生产构建
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # 这个名字必须与 Codemagic 后台 Team integrations > Developer Portal 里填的 key 名称一致
      app_store_connect: eartraining-codemagic
    environment:
      groups:
        - ios_signing_credentials
      vars:
        BUNDLE_ID: com.lianerdazi.app
      node: v22.11.0
      # 固定版本，避免 Codemagic 的 latest 别名更新后改变构建环境。
      xcode: 26.4
      cocoapods: default
    scripts:
      - name: 安装 npm 依赖
        script: npm ci
      - name: 生成 iOS 原生工程（Expo prebuild）
        script: CI=1 npx expo prebuild --platform ios --no-install
      - name: 安装 CocoaPods 依赖
        script: cd ios && pod install
      - name: 初始化 iOS 签名钥匙串
        script: keychain initialize
      - name: 获取或创建 App Store 签名文件
        script: |
          CERTIFICATE_KEY_FILE="$CM_BUILD_DIR/codemagic_ios_distribution.key"
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_BASE64" \
            | openssl base64 -d -A -out "$CERTIFICATE_KEY_FILE"
          chmod 600 "$CERTIFICATE_KEY_FILE"
          openssl rsa -in "$CERTIFICATE_KEY_FILE" -check -noout
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$CERTIFICATE_KEY_FILE" \
            --create
      - name: 安装 iOS 签名证书
        script: keychain add-certificates
      - name: 检测 Xcode workspace 与 scheme
        script: |
          WORKSPACE_FILE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE_FILE"
          SCHEME_NAME=$(basename "$WORKSPACE_FILE" .xcworkspace)
          echo "workspace=$WORKSPACE_FILE"
          echo "scheme=$SCHEME_NAME"
          echo "XCODE_WORKSPACE=$WORKSPACE_FILE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$SCHEME_NAME" >> "$CM_ENV"
      - name: 设置代码签名
        script: xcode-project use-profiles
      - name: 构建 ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # 自动上传到 App Store Connect（不自动提交审核，首版由人工在后台提交）
      app_store_connect:
        auth: integration
        submit_to_app_store: false
        submit_to_testflight: true
        beta_groups:
          - Team (Expo)
